name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Go to repo folder
        run: cd "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: cd "$GITHUB_WORKSPACE" && npm ci

      - name: Run tests
        run: cd "$GITHUB_WORKSPACE" && npm test

      - name: Build project
        run: cd "$GITHUB_WORKSPACE" && npm run build